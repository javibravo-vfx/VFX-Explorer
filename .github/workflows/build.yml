name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_core.py

      - name: Compilar exe portable
        run: >
          pyinstaller --noconfirm --clean --windowed --name VFXExplorer
          --icon assets/icon.ico --collect-all OpenImageIO --exclude-module tkinter main.py

      - name: Selftest del exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\VFXExplorer\VFXExplorer.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\vfxexplorer_selftest.log"
          if ($p.ExitCode -ne 0) { throw "selftest falló ($($p.ExitCode))" }

      - name: Empaquetar
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "dist\VFXExplorer\VFXExplorer_data" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "dist\VFXExplorer\bin" | Out-Null
          Set-Content "dist\VFXExplorer\bin\LEEME.txt" "Pone aca ffmpeg.exe y ffprobe.exe para thumbnails e info de video."
          Copy-Item README.md "dist\VFXExplorer\"
          Compress-Archive -Path "dist\VFXExplorer" -DestinationPath "VFXExplorer-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VFXExplorer-win64
          path: VFXExplorer-win64.zip

      - name: Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VFXExplorer-win64.zip
          generate_release_notes: true
