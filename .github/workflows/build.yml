name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_core.py
          python tests/test_storage_cache.py
          python tests/test_network_state.py
          python tests/test_media_process.py
          python tests/test_storage_routing.py
          python tests/test_media_transport.py

      - name: Compilar exe portable
        run: >
          pyinstaller --noconfirm --clean --windowed --name VFXExplorer
          --icon assets/icon.ico --collect-all OpenImageIO --collect-all pypdfium2 --collect-all pypdfium2_raw --exclude-module tkinter main.py

      - name: Incluir ffmpeg (LGPL, shared) en bin
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UseBasicParsing; $ok = $true; Write-Host "OK $u"; break }
            catch { Write-Host "no: $u" }
          }
          if (-not $ok) { throw "no se pudo bajar ffmpeg" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x -Force
          $root = Get-ChildItem ffmpeg_x -Directory | Select-Object -First 1
          $bin = "dist\VFXExplorer\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Get-ChildItem "$($root.FullName)\bin" | Where-Object { $_.Name -ne "ffplay.exe" } | Copy-Item -Destination $bin
          Copy-Item "$($root.FullName)\LICENSE.txt" "$bin\FFMPEG-LICENSE.txt" -ErrorAction SilentlyContinue
          Set-Content "$bin\README-ffmpeg.txt" "FFmpeg (LGPL build by BtbN, https://github.com/BtbN/FFmpeg-Builds). Source: https://ffmpeg.org"
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Selftest del exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\VFXExplorer\VFXExplorer.exe" -ArgumentList "--selftest","--require-ffmpeg" -Wait -PassThru
          Get-Content "$env:TEMP\vfxexplorer_selftest.log"
          if ($p.ExitCode -ne 0) { throw "selftest falló ($($p.ExitCode))" }

      - name: NAS selftest del exe (OpenImageIO + procesos)
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist\VFXExplorer\VFXExplorer.exe").Path
          Remove-Item "$env:TEMP\vfxexplorer_nas_selftest.log" -ErrorAction SilentlyContinue
          # Create a temporary loopback SMB mapping, if the runner permits it.
          # If provisioning is unavailable, explicitly log the skipped real-SMB test;
          # the synthetic NAS decoder test and mocked routing tests remain mandatory.
          $share = "VFXLoopback$([Guid]::NewGuid().ToString('N').Substring(0,8))"
          $local = Join-Path $env:RUNNER_TEMP $share
          $letter = $null
          $created = $false
          $mapped = $false
          try {
            try {
              New-Item -ItemType Directory -Force $local | Out-Null
              $used = @(Get-PSDrive -PSProvider FileSystem | ForEach-Object { $_.Name })
              $letter = @('Z','Y','X','V','U','R') | Where-Object { $_ -notin $used } | Select-Object -First 1
              if (-not $letter) { throw "No free drive letter for loopback fixture" }
              New-SmbShare -Name $share -Path $local -FullAccess "$env:USERDOMAIN\$env:USERNAME" -ErrorAction Stop | Out-Null
              $created = $true
              $drive = "${letter}:"
              & net.exe use $drive "\\$env:COMPUTERNAME\$share" /persistent:no
              if ($LASTEXITCODE -ne 0) { throw "Cannot map local SMB fixture" }
              $mapped = $true
              if (-not (Test-Path "${drive}\")) { throw "Cannot access local SMB fixture" }
              $env:VFX_LOOPBACK_LOCAL = $local
              $env:VFX_LOOPBACK_MAPPED = "${drive}\"
            } catch {
              Write-Warning "Real SMB fixture unavailable: $_. Routing mocks and synthetic NAS test still run."
              Remove-Item Env:VFX_LOOPBACK_LOCAL,Env:VFX_LOOPBACK_MAPPED -ErrorAction SilentlyContinue
            }
            $p = Start-Process -FilePath $exe -ArgumentList "--nas-selftest" -Wait -PassThru
            if (Test-Path "$env:TEMP\vfxexplorer_nas_selftest.log") { Get-Content "$env:TEMP\vfxexplorer_nas_selftest.log" }
            if ($p.ExitCode -ne 0) { throw "NAS selftest falló ($($p.ExitCode))" }
            if (-not (Test-Path "$env:TEMP\vfxexplorer_nas_selftest.log")) { throw "NAS selftest no produjo log" }
            if (-not (Select-String -Path "$env:TEMP\vfxexplorer_nas_selftest.log" -Pattern '^NAS SELFTEST OK$' -Quiet)) { throw "NAS selftest no terminó" }
            $left = @(Get-Process VFXExplorer -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
            if ($left.Count -gt 0) { $left | Stop-Process -Force; throw "Procesos VFXExplorer huérfanos" }
          } finally {
            Remove-Item Env:VFX_LOOPBACK_LOCAL,Env:VFX_LOOPBACK_MAPPED -ErrorAction SilentlyContinue
            if ($mapped -and $letter) { & net.exe use "${letter}:" /delete /y | Out-Null }
            if ($created) { Remove-SmbShare -Name $share -Force -ErrorAction SilentlyContinue }
            Remove-Item -Recurse -Force $local -ErrorAction SilentlyContinue
          }

      - name: Estrés NAS del exe (navegar con el NAS durmiéndose)
        timeout-minutes: 25
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist\VFXExplorer\VFXExplorer.exe").Path
          $dir = Join-Path $env:TEMP "vfx_nas_stress"
          $failed = @()
          foreach ($seed in 1, 2, 3) {
            Write-Host "===== semilla $seed ====="
            $p = Start-Process -FilePath $exe -ArgumentList "--nas-stress $seed 400" -Wait -PassThru
            if (Test-Path "$dir\result.log") { Get-Content "$dir\result.log" }
            if ($p.ExitCode -ne 0) {
              $failed += $seed
              Write-Host "----- crash.log (semilla $seed, código de salida $($p.ExitCode)) -----"
              if (Test-Path "$dir\crash.log") { Get-Content "$dir\crash.log" } else { Write-Host "(sin crash.log)" }
            }
            Remove-Item "$dir\result.log" -ErrorAction SilentlyContinue
          }
          $left = @(Get-Process VFXExplorer -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          if ($left.Count -gt 0) { $left | Stop-Process -Force; throw "Procesos VFXExplorer huérfanos" }
          if ($failed.Count -gt 0) { throw "Estrés NAS falló en las semillas: $($failed -join ', ')" }

      - name: Estrés NAS con ventana real de Windows (informativo)
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\VFXExplorer\VFXExplorer.exe").Path
          $dir = Join-Path $env:TEMP "vfx_nas_stress"
          $p = Start-Process -FilePath $exe -ArgumentList "--nas-stress 4 300" -Wait -PassThru
          if (Test-Path "$dir\result.log") { Get-Content "$dir\result.log" }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$dir\crash.log") { Get-Content "$dir\crash.log" }
            throw "Estrés NAS (ventana real) falló ($($p.ExitCode))"
          }

      - name: Tiempo de arranque
        shell: pwsh
        run: |
          foreach ($i in 1..2) {
            $t = Measure-Command { Start-Process -FilePath "dist\VFXExplorer\VFXExplorer.exe" -ArgumentList "--startup-timing" -Wait }
            Write-Host "---- arranque $i  (proceso completo, con 0.3 s de cierre: $([math]::Round($t.TotalSeconds,2)) s)"
            Get-Content "$env:TEMP\vfxexplorer_startup.log" | Select-Object -First 60
          }

      - name: Empaquetar
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "dist\VFXExplorer\VFXExplorer_data" -ErrorAction SilentlyContinue
          Copy-Item README.md "dist\VFXExplorer\"
          Compress-Archive -Path "dist\VFXExplorer" -DestinationPath "VFXExplorer-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VFXExplorer-win64
          path: VFXExplorer-win64.zip

      - name: Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VFXExplorer-win64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
